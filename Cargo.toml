[package]
name = "gss"
version = "0.1.0"
edition = "2024"
default-run = "gss_test"

[dependencies]
lex-just-parse = { version = "1.3.1" }
lsp-server = { version = "0.10.0", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }

[features]
default = ["interning", "value-enum"]
interning = ["lex-just-parse/interning"]
value-enum = []
lsp = ["dep:lsp-server", "dep:serde", "dep:serde_json"]

[[bin]]
name = "gss_test"
path = "src/bin/main.rs"

[[bin]]
name = "gss-fmt"
path = "src/bin/gss-fmt.rs"

[[bin]]
name = "gss-lsp"
path = "src/bin/gss-lsp.rs"
required-features = ["lsp"]

[[test]]
name = "test_gss_fmt"
path = "tests/test_gss_fmt.rs"

[[test]]
name = "test_gss_lsp"
path = "tests/test_gss_lsp.rs"
required-features = ["lsp"]
