[package]
name = "gss"
version = "0.1.0"
edition = "2024"
default-run = "gss_test"

[dependencies]
lex-just-parse = { version = "1.3.1" }
lsp-server = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[features]
default = ["interning", "value-enum"]
interning = ["lex-just-parse/interning"]
value-enum = []

[[bin]]
name = "gss_test"
path = "src/bin/main.rs"

[[bin]]
name = "gss-fmt"
path = "src/bin/gss-fmt.rs"

[[bin]]
name = "gss-lsp"
path = "src/bin/gss-lsp.rs"
